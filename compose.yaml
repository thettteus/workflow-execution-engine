services:
  wee:
    build: .
    image: wee:local
    ports:
      # Loopback only: the API has no authentication yet (M2.7). Publishing it on
      # every interface would hand settings, secrets, approvals and runs to
      # anything on the network (docs/threat-model.md §6).
      - "127.0.0.1:7676:7676"
    volumes:
      - wee-data:/data/.workflow
      - wee-workflows:/workflows
      - ./examples/templates:/templates:ro
    restart: unless-stopped

volumes:
  wee-data:
  wee-workflows:
